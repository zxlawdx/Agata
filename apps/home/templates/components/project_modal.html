  <dialog id="agata-create-dialog" class="agata-dialog">
    <form id="agata-create-form">
      <header><div><small>COMECE UMA IDEIA</small><h2>Novo projeto ✦</h2></div><button type="button" id="agata-close-create" aria-label="Fechar">×</button></header>
      <label>Nome do projeto<input id="agata-name" name="name" placeholder="Minha criação" maxlength="80" autocomplete="off" required></label>
      <label>Modelo<select id="agata-template"><option value="empty">Empty Activity — Jetpack Compose</option><option value="blank-canvas">Blank Canvas — área de desenho</option><option value="navigation-app">Navigation App</option><option value="material3-starter">Material 3 Starter</option><option value="android-tutorial">Meu Primeiro Aplicativo Android</option><option value="authentication">Autenticação Material 3 (demonstração)</option><option value="dashboard">Dashboard</option><option value="sidebar">Sidebar / regiões</option><option value="bars">Bottom Navigation + TopBar</option><option value="profile">Perfil</option><option value="settings">Configurações</option><option value="form">Formulário</option><option value="catalog">Catálogo</option><option value="list-detail">Lista / Detalhes</option><option value="tasks">Tarefas</option><option value="music-dark">Music Dark</option><option value="social-modern">Social Modern</option><option value="editorial-minimal">Editorial Minimal</option><option value="fintech-premium">Fintech Premium</option><option value="material-expressive">Material Expressive</option><option value="glass-blur">Glass / Blur</option></select></label>
      <div class="agata-field-row">
        <label>Ambiente<select id="agata-mode"><option value="sketch">Esboço</option><option value="drawing">Área de desenho</option><option value="svg">Vetores / SVG</option></select></label>
        <label>Formato<select id="agata-platform"><option value="android">Android</option><option value="web">Web</option><option value="desktop">Desktop</option></select></label>
      </div>
      <div class="agata-field-row">
        <label>Largura <input id="agata-width" type="number" min="240" max="4096" value="390" required></label>
        <label>Altura <input id="agata-height" type="number" min="240" max="4096" value="844" required></label>
      </div>
      <details id="agata-wizard-settings"><summary>2 · Configurações Android</summary><label>Package name<input id="agata-package" value="com.example.agata" required></label><label>Local do projeto (pasta nova ou vazia)<input id="agata-location" placeholder="Padrão: ~/Agata/Projetos"><button id="agata-choose-location" type="button">Escolher local</button></label><div class="agata-field-row"><label>Minimum SDK<input id="agata-min-sdk" type="number" min="24" max="36" value="24"></label><label>Target SDK<input id="agata-target-sdk" type="number" min="24" max="36" value="36"></label></div><div class="agata-field-row"><label>UI Framework<select id="agata-ui-framework"><option value="compose">Jetpack Compose</option><option value="xml">Android Views/XML</option></select></label><label>Theme<select id="agata-theme"><option value="system">Sistema</option><option value="light">Claro</option><option value="dark">Escuro</option></select></label></div><label>Orientation<select id="agata-orientation"><option value="unspecified">Adaptável</option><option value="portrait">Retrato</option><option value="landscape">Paisagem</option></select></label><p>O destino deve estar vazio. Gradle não será executado. Blank Canvas usa Desenho/Vetores; o projeto Android vazio é editável em Interfaces Android.</p></details>
      <p id="agata-wizard-review" hidden></p><button type="button" id="agata-wizard-next">Próxima etapa: configurações →</button>
      <p id="agata-form-error" class="agata-error" role="alert" hidden></p>
      <footer><button type="button" id="agata-cancel-create" class="agata-btn-outline">Cancelar</button><button type="submit" id="agata-confirm-create" class="agata-btn-yellow">Criar projeto →</button></footer>
    </form>
  </dialog>
