<link rel="stylesheet" href="{{ static('android_designer/designer.css') }}">
<section id="android-designer" data-project-id="{{ project_id }}" data-registry="{{ static('android_designer/model/components.json') }}">
 <header class="ad-header"><button id="ad-toggle-library" aria-expanded="true">Biblioteca</button><button id="ad-toggle-inspector" aria-expanded="true">Inspector</button><strong>Agata · Interfaces Android</strong><label class="ad-theme-setting">Tema da IDE
  <select id="ad-ide-theme" aria-label="Tema do editor"><option value="system">Sistema</option><option value="light">Claro</option><option value="dark">Escuro</option></select></label><output id="ad-dirty">Carregando…</output><button id="ad-help">Ajuda · Tutorial</button><button id="ad-save">Salvar</button><button id="ad-home">Workspace</button><button id="ad-drawing">Desenho</button></header>
 <nav class="ad-actions" aria-label="Modos e exportações"><button data-mode="design" aria-pressed="true">Design</button><button data-mode="code">Código</button><button data-mode="preview">Preview</button><button data-mode="split">Dividido</button><span></span><button id="ad-undo">Desfazer</button><button id="ad-redo">Refazer</button><button id="ad-export-xml">Exportar XML</button><button id="ad-export-compose">Exportar Kotlin</button></nav>
 <div class="ad-layout">
  <aside class="ad-library"><h3>Screens</h3><div id="ad-screens"></div><button id="ad-new-screen">Nova Screen</button><button id="ad-duplicate-screen">Duplicar Screen</button><button id="ad-delete-screen">Excluir Screen</button><button id="ad-example">Inserir exemplo de login</button><h3>Componentes</h3><select id="ad-component-kind" aria-label="Tipo de componente"></select><button id="ad-add-component">Inserir componente</button><h3>Layers</h3><button id="ad-new-layer">Criar camada da seleção</button><div id="ad-layers" aria-label="Camadas de edição"></div><h3>Hierarquia</h3><div id="ad-tree" role="tree"></div><div class="ad-tree-actions"><button id="ad-copy">Copiar</button><button id="ad-paste">Colar</button><button id="ad-duplicate">Duplicar</button><button id="ad-delete">Excluir</button><button id="ad-group">Agrupar</button><button id="ad-ungroup">Desagrupar</button><button id="ad-up">Subir</button><button id="ad-down">Descer</button></div></aside>
  <main class="ad-center">
   <div id="ad-palette" aria-label="Arrastar da biblioteca"></div>
   <div id="ad-workspace-tools" class="ad-workspace-tools"><button id="ad-zoom-out">−</button><output id="ad-zoom">100%</output><button id="ad-zoom-in">+</button><button id="ad-fit">Ajustar telas</button><button id="ad-reset">Reset</button><button id="ad-grid" aria-pressed="true">Grade</button><button id="ad-connections" aria-pressed="false">Conexões</button><button id="ad-constraint-mode" aria-pressed="false">Constraints</button><button id="ad-add-region">Nova região</button><button id="ad-center-node">Centralizar no pai</button><button id="ad-flow">Mapa de fluxo</button><button id="ad-connect" title="Arraste este controle até a Screen de destino">Conectar selecionado →</button></div>
   <div id="ad-workspace" tabindex="0" aria-label="Workspace de Screens"><div id="ad-space"><svg id="ad-links" aria-label="Conexões entre Screens"></svg><div id="ad-frames"></div></div></div>
   <section id="ad-code" hidden><div class="ad-code-tools"><select id="ad-backend" aria-label="Backend"><option value="compose">Kotlin / Compose</option><option value="xml">Android XML</option><option value="model">Modelo JSON (sincronizado)</option></select><button id="ad-generate">Atualizar código</button><select id="ad-file" aria-label="Arquivo gerado"></select><button id="ad-customize">Personalizar arquivo</button><button id="ad-apply-model">Aplicar JSON ao Design</button><button id="ad-discard-json">Descartar rascunho JSON</button><button id="ad-format-json">Formatar JSON</button></div><p id="ad-code-note"></p><div id="ad-code-editor"></div><p id="ad-code-error" role="alert"></p></section>
   <section id="ad-preview" hidden><div class="ad-preview-tools"><button id="ad-preview-back">Voltar</button><button id="ad-preview-reset">Reiniciar</button><select id="ad-preview-preset" aria-label="Dispositivo Preview"><option value="320,640">Celular compacto</option><option value="390,844" selected>Celular padrão</option><option value="480,960">Celular grande</option><option value="768,1024">Tablet</option><option value="844,390">Phone landscape</option><option value="1024,1366">Tablet portrait</option><option value="1366,1024">Tablet landscape</option><option value="900,1200">Foldable (janela)</option><option value="1600,1000">Desktop-size window</option><option value="1200,900">Expandida</option><option value="custom">Personalizado</option></select><button id="ad-preview-rotate">Girar</button><input id="ad-preview-width" aria-label="Largura Preview" type="number" min="240" max="4096" value="390"><input id="ad-preview-height" aria-label="Altura Preview" type="number" min="240" max="4096" value="844"><select id="ad-font-scale" aria-label="Escala de fonte"><option value="1">Fonte 100%</option><option value="1.3">Fonte 130%</option><option value="1.5">Fonte 150%</option><option value="2">Fonte 200%</option></select><output id="ad-preview-name"></output></div><div id="ad-preview-viewport"><div id="ad-preview-screen"></div></div><ul id="ad-layout-diagnostics" aria-live="polite"></ul></section>
  </main>
  <aside class="ad-inspector"><h3>Inspector</h3><div id="ad-inspector"></div></aside>
 </div>
 <footer>Modelo Android independente · Coordenadas do workspace não são exportadas como layout · <span id="ad-status"></span></footer>
 <div id="ad-toast" hidden></div>
</section>
<script>
(async()=>{
 const root=document.getElementById('android-designer');
 try{
  for(const src of ["{{ static('home/js/notifications.js') }}","{{ static('android_designer/vendor/codemirror.js') }}","{{ static('android_designer/js/model.js') }}","{{ static('android_designer/js/layout.js') }}","{{ static('android_designer/js/constraints.js') }}","{{ static('android_designer/js/graphics.js') }}","{{ static('android_designer/js/compose_presentation.js') }}","{{ static('android_designer/js/renderer.js') }}","{{ static('android_designer/js/drag_drop.js') }}","{{ static('android_designer/js/constraint_editor.js') }}","{{ static('android_designer/js/tutorial.js') }}","{{ static('android_designer/js/navigation_routes.js') }}","{{ static('android_designer/js/navigation_editor.js') }}","{{ static('android_designer/js/desktop.js') }}","{{ static('android_designer/js/code_workflow.js') }}","{{ static('android_designer/js/graphics_editor.js') }}","{{ static('android_designer/js/project_explorer.js') }}","{{ static('android_designer/js/premium.js') }}","{{ static('android_designer/js/designer.js') }}"]){await new Promise((resolve,reject)=>{const script=document.createElement('script');script.src=src;script.onload=resolve;script.onerror=()=>reject(Error('Falha ao carregar '+src));document.head.append(script);});if(!root.isConnected)return;}
  await window.AgataAndroidDesigner.mount(root);
 }catch(e){if(root.isConnected){root.querySelector('#ad-status').textContent=e.message;root.querySelector('#ad-toast').hidden=false;root.querySelector('#ad-toast').textContent=e.message;}}
})();
</script>
