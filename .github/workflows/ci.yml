name: Agata checks

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Configure Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python runtime
        run: python -m pip install -r requirements.txt tree-sitter==0.26.0 tree-sitter-kotlin==1.1.0

      - name: Check Python syntax
        run: python -m compileall -q apps config manage.py tests

      - name: Run project and sketch service tests
        run: python -m unittest discover -s tests -v

      - name: Check JavaScript syntax
        run: npm run check:js

      - name: Run JavaScript behavior tests
        run: node --test tests/*.test.cjs

      - name: Verify committed Fabric offline assets
        run: python -c "from apps.sketch_editor.services.vendor import verify_vendor; verify_vendor()"

      - name: Validate editable component structure
        run: node --test tests/component_edit.test.cjs tests/element_tree.test.cjs tests/editor_controls.test.cjs

      - name: Verify Picadeiro Pop home interactions
        run: node --test tests/home_picadeiro.test.cjs tests/studio_picadeiro.test.cjs

      - name: Verify template static paths
        run: python -m unittest tests.verify_static_paths -v

      - name: Install browser test tools (CI only)
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Exercise rendered Vela UI and isolated Python services
        run: npm run test:ui

      - name: Run semantic Android model tests
        run: node --test tests/android_model.test.cjs

      - name: Exercise Android model, Preview and source export
        env:
          AGATA_UI_SCRIPT: tests/android_ui.cjs
        run: node tests/run_ui.cjs

      - name: Exercise pointer drag and responsive layouts
        env:
          AGATA_UI_SCRIPT: tests/responsive_ui.cjs
        run: node tests/run_ui.cjs

      - name: Exercise constraints, regions, layers and guided tutorial
        env:
          AGATA_UI_SCRIPT: tests/constraints_ui.cjs
        run: node tests/run_ui.cjs

      - name: Exercise integrated navigation, paint, graphics and code workflow
        env:
          AGATA_UI_SCRIPT: tests/workflow_ui.cjs
        run: node tests/run_ui.cjs

      - name: Verify one-step undo across sketch, Android and code editors
        env:
          AGATA_UI_SCRIPT: tests/undo_ui.cjs
        run: node tests/run_ui.cjs

      - name: Exercise real project import and empty Android workspace
        env:
          AGATA_UI_SCRIPT: tests/project_import_ui.cjs
        run: node tests/run_ui.cjs

      - name: Exercise editable lists and native exports
        env:
          AGATA_UI_SCRIPT: tests/lists_ui.cjs
        run: node tests/run_ui.cjs
