name: Yara checks

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Configure Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check Python syntax
        run: python -m compileall -q apps config manage.py tests

      - name: Run project and sketch service tests
        run: python -m unittest discover -s tests -v

      - name: Check JavaScript syntax
        run: npm run check:js

      - name: Run sketch layer model tests
        run: node --test tests/sketch_core.test.cjs

      - name: Verify Fabric offline asset can be produced
        run: |
          npm install --no-audit --no-fund --ignore-scripts
          npm run vendor
          test -s apps/sketch_editor/static/vendor/fabric.js

      - name: Validate editable component structure
        run: node --test tests/component_edit.test.cjs tests/element_tree.test.cjs tests/editor_controls.test.cjs

      - name: Verify Picadeiro Pop home interactions
        run: node --test tests/home_picadeiro.test.cjs tests/studio_picadeiro.test.cjs

      - name: Verify template static paths
        run: python -m unittest tests.verify_static_paths -v
